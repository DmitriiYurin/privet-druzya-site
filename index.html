<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="Небольшая страница, которой можно поделиться с друзьями.">
  <title>Привет, друзья!</title>
  <style>
    :root { color-scheme: light; --ink:#24302b; --muted:#68736c; --green:#315c49; --paper:#f7f4ed; --card:#fffefa; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width:min(100%, 620px); text-align:center; padding:clamp(32px, 8vw, 72px) clamp(24px, 7vw, 64px); background:var(--card); border:1px solid #eae6dc; border-radius:28px; box-shadow:0 18px 55px #33301a0c; }
    .emoji { font-size:48px; line-height:1; margin-bottom:26px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:750; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:14px 0 16px; font-size:clamp(38px, 9vw, 62px); letter-spacing:-.055em; line-height:1.04; }
    p { max-width:410px; margin:0 auto; color:var(--muted); font-size:17px; line-height:1.7; }
    button { display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:32px; padding:15px 23px; border:0; border-radius:999px; background:var(--green); color:white; font:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:transform .15s, background .15s; }
    button:hover { background:#244a38; transform:translateY(-2px); }
    button:focus-visible { outline:3px solid #9cbea9; outline-offset:4px; }
    #status { min-height:24px; margin-top:14px; color:var(--green); font-size:14px; }
    footer { margin-top:20px; color:#9a9c91; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🌿</div>
    <div class="eyebrow">Маленькая страница для своих</div>
    <h1>Привет,<br>друзья!</h1>
    <p>Рад, что вы заглянули. Пусть сегодня найдётся время для хорошего разговора, прогулки и чего-нибудь вкусного ☀️</p>
    <button id="share" type="button"><span aria-hidden="true">↗</span> Поделиться страницей</button>
    <div id="status" role="status" aria-live="polite"></div>
    <footer>Сделано с теплом</footer>
  </main>
  <script>
    const button = document.querySelector('#share');
    const status = document.querySelector('#status');
    button.addEventListener('click', async () => {
      const shareData = { title: document.title, text: 'Привет, друзья! Загляните на эту страницу.', url: location.href };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
          status.textContent = 'Спасибо, что поделились!';
        } else {
          await navigator.clipboard.writeText(location.href);
          status.textContent = 'Ссылка скопирована — отправьте её друзьям.';
        }
      } catch (error) {
        if (error.name !== 'AbortError') status.textContent = 'Скопируйте адрес страницы из адресной строки браузера.';
      }
    });
  </script>
</body>
</html>
